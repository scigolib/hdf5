name: Tests

# Testing Strategy:
# - Tests run on Linux, macOS, and Windows (cross-platform library)
# - HDF5 is a cross-platform file format - must work everywhere
# - Go 1.25+ required (matches go.mod requirement)
#
# Branch Strategy (GitHub Flow):
# - feature/** branches: Development work
# - fix/** branches: Bug fixes
# - release/** branches: Pre-release testing
# - main branch: Production-ready code only (protected)
# - Pull requests: must pass the "Required checks" gate and get an approving review

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  # The go command must not download a newer toolchain: with GOTOOLCHAIN=auto the 1.25 and 1.26
  # legs would quietly test the newest Go instead of the version they name.
  GOTOOLCHAIN: local

jobs:
  # Unit tests - Cross-platform
  unit-tests:
    name: Unit Tests - ${{ matrix.os }} - Go ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.25', '1.26', '1.27']  # go.mod minimum, oldstable and stable

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run go vet
      if: matrix.os == 'ubuntu-latest'
      run: go vet ./...

    - name: Run unit tests with race detector
      shell: bash
      run: go test -short -v -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.25'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.txt
        flags: unittests
        name: codecov-unit
        fail_ci_if_error: false
        verbose: true

  # C-library interop - Go-written files validated with official HDF5 tools
  c-interop:
    name: C Library Interop
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: true

    - name: Install HDF5 tools
      run: sudo apt-get update && sudo apt-get install -y hdf5-tools

    - name: Run C interop tests
      # TestChunkedRewrite files are checked with h5dump as well: the rewrite
      # fix (issue #80) relies on the C library reading files whose blocks
      # were reused and freed.
      run: go test -v -run 'TestCInterop|TestChunkedRewrite' .

  # 32-bit cross-build - the library must compile on Raspberry Pi (arm) and 386
  cross-build:
    name: Cross-Build 32-bit
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Build linux/386
      run: GOOS=linux GOARCH=386 go build ./...

    - name: Build linux/arm GOARM=6
      run: GOOS=linux GOARCH=arm GOARM=6 go build ./...

    - name: Build windows/386
      run: GOOS=windows GOARCH=386 go build ./...

    - name: Vet linux/386
      run: GOOS=linux GOARCH=386 go vet ./...

  # Native Go fuzzing - the safety net for issue #68 (ADR-003): a corrupted
  # byte must produce an error, never a panic or a fatal allocation.
  # Non-blocking until the targets prove stable; a crash uploads its reproducer.
  fuzz:
    name: Fuzz - ${{ matrix.target }}
    runs-on: ubuntu-latest
    continue-on-error: true  # Non-blocking until the targets prove stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: .
            target: FuzzOpenFile
          - package: ./internal/core
            target: FuzzParseAttributeMessage

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Run ${{ matrix.target }}
      # Minimization is off on purpose: Go also queues coverage-expanding inputs
      # for minimization (internal/fuzz/fuzz.go), and its default budget equals
      # this job's fuzz time, so a run can spend the whole 60 s minimizing a
      # handful of inputs with the exec counter frozen. With 0, coverage results
      # are admitted immediately and a crasher is saved unminimized.
      run: go test -run=^$ -fuzz=${{ matrix.target }} -fuzztime=60s -fuzzminimizetime=0 ${{ matrix.package }}

    - name: Upload fuzz corpus
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: fuzz-corpus-${{ matrix.target }}
        path: |
          testdata/fuzz
          internal/core/testdata/fuzz
        if-no-files-found: ignore
        retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: false  # Strict for production library

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: true

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        args: --timeout=5m

  # Formatting check
  formatting:
    name: Code Formatting
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: true

    - name: Check formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "ERROR: The following files are not formatted:"
          gofmt -l .
          echo ""
          echo "Run 'go fmt ./...' to fix formatting issues."
          exit 1
        fi
        echo "All files are properly formatted ✓"

  # Informational: a known vulnerability in the dependencies or the standard library is reported,
  # but it does not block a merge by itself. It is read before a release.
  vulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Run govulncheck
      uses: golang/govulncheck-action@v1
      with:
        go-version-input: stable
        go-package: ./...

  # The one required check. `if: always()` and the explicit result loop are both needed: a job that
  # is skipped (for example because a job it needs failed) counts as passed for a required check, so
  # a gate without them can let a red pull request through.
  required:
    name: Required checks
    if: always()
    needs: [unit-tests, c-interop, cross-build, lint, formatting]
    runs-on: ubuntu-latest

    steps:
    - name: Every required job succeeded
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "results: $RESULTS"
        for r in $RESULTS; do
          if [ "$r" != success ]; then echo "a required job ended with: $r"; exit 1; fi
        done
